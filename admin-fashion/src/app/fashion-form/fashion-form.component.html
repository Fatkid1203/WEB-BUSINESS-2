<div class="container">
  <h2>{{ isEditMode ? 'Edit Fashion' : 'Add New Fashion' }}</h2>

  <div class="error" *ngIf="errMessage">{{ errMessage }}</div>

  <form (ngSubmit)="onSubmit()" class="fashion-form">
    <div class="form-group">
      <label for="title">Title</label>
      <input type="text" id="title" [(ngModel)]="fashion.title" name="title" required placeholder="Enter fashion title" />
    </div>

    <div class="form-group">
      <label for="style">Style</label>
      <input type="text" id="style" [(ngModel)]="fashion.style" name="style" required placeholder="e.g. Street Style, Trends, Casual" />
    </div>

    <div class="form-group">
      <label for="thumbnail">Thumbnail URL</label>
      <input type="text" id="thumbnail" [(ngModel)]="fashion.thumbnail" name="thumbnail" required placeholder="Enter image URL" />
      <div class="preview" *ngIf="fashion.thumbnail">
        <img [src]="fashion.thumbnail" alt="Preview" />
      </div>
    </div>

    <div class="form-group">
      <label>Details (WYSIWYG Editor)</label>
      <quill-editor
        [(ngModel)]="fashion.details"
        name="details"
        [modules]="quillConfig"
        [styles]="{ height: '250px' }"
        placeholder="Enter fashion details..."
      ></quill-editor>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-save">{{ isEditMode ? 'Update' : 'Save' }}</button>
      <a routerLink="/fashions" class="btn btn-cancel">Cancel</a>
    </div>
  </form>
</div>
