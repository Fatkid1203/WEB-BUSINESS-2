<p>book-update works!</p>
<p class="text-danger">{{errMessage}}</p>
<table class="table-borderless">
    <tr>
        <td>Book Id:</td>
        <td>
            <input type="text" class="form-control" #name="ngModel" name="BookId" id="BookId"
                placeholder="Enter Book Id" [(ngModel)]="book['BookId']" />
        </td>
    </tr>
    <tr>
        <td>Book Name:</td>
        <td>
            <input type="text" class="form-control" #name="ngModel" name="BookName" id="BookName"
                placeholder="Enter Book Name" [(ngModel)]="book['BookName']" />
        </td>
    </tr>
    <tr>
        <td>Price:</td>
        <td>
            <input type="text" class="form-control" #name="ngModel" name="BookPrice" id="BookPrice"
                placeholder="Enter Price" [(ngModel)]="book['Price']" />
        </td>
    </tr>
    <tr>
        <td>Image:</td>
        <td>
            <input type="text" class="form-control" #name="ngModel" name="BookImage" id="BookImage"
                placeholder="Enter Image (e.g. p1.png)" [(ngModel)]="book['Image']" />
        </td>
    </tr>
    <tr>
        <td colspan="2">
            <button (click)="putBook()" class="btn btn-outline-dark">Update</button>
        </td>
    </tr>
</table>
<table border="1">
    <tr>
        <td>BookId</td>
        <td>BookName</td>
        <td>Price</td>
        <td>Image</td>
    </tr>
    <tbody>
        <tr *ngFor="let book of books">
            <td>{{book.BookId || book.id}}</td>
            <td>{{book.BookName || book.Tensach}}</td>
            <td>{{book.Price || book.Giaban}}</td>
            <td>
                <!-- Using a more robust pattern to support both ex44 and ex50 dataset forms -->
                <img [src]="(book.Image || book.Anhbia || '').startsWith('p') ? '/images/' + (book.Image || book.Anhbia) : '/image/' + (book.Image || book.Anhbia)"
                    width="50px" height="50px">
            </td>
        </tr>
    </tbody>
</table>
